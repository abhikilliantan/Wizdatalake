services:
  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (raw data lake layer)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: datalake-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9006}:9000"   # S3 API (host → container)
      - "${MINIO_CONSOLE_PORT:-9007}:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datalake

  # Create the raw data-lake bucket on first boot (idempotent)
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: datalake-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      echo \"Bucket ready: $${MINIO_BUCKET}\";
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-datalake-raw}
    networks:
      - datalake
    restart: "no"

  # ---------------------------------------------------------------------------
  # Redpanda — Kafka-compatible event streaming broker
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: datalake-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API (host)
      - "18081:18081"   # Schema Registry (host)
      - "18082:18082"   # Pandaproxy / HTTP Proxy (host)
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - datalake

  # ---------------------------------------------------------------------------
  # PostgreSQL — metadata catalog, application state, audit logs
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: datalake-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datalake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datalake}
      POSTGRES_DB: ${POSTGRES_DB:-datalake}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datalake

volumes:
  minio_data:
  redpanda_data:
  postgres_data:

networks:
  datalake:
    driver: bridge
